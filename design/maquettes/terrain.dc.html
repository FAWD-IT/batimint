<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>App terrain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#2F4BFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; font-family: 'Geist', system-ui, sans-serif; color: #111111; display: flex; flex-direction: column; font-variant-numeric: tabular-nums;">

<div style="flex-grow: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 13px; color: #5E5E5A;">Jeudi 1 octobre</div>
<div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">Bonjour Karim</div>
</div>
<div style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E2DC; font-size: 12px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1E7B45;"></span>Hors ligne OK</div>
</div>

<section style="background: #111111; color: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
<div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #B8B8B8;">Ton chantier du jour</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="font-size: 20px; font-weight: 700; letter-spacing: -0.015em;">Salle de bain Dupont</div>
<div style="font-size: 14px; color: #CFCFCF;">Rue de la Station 42, Jumet</div>
</div>
<div style="height: 96px; border-radius: 12px; background: #262626; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9A9A9A;">Carte · itinéraire</div>
<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="display: flex; align-items: center; gap: 8px;">
<div style="display: flex;">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #7D93FF; color: #111111; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #111111;">KB</span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: #F0A045; color: #111111; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #111111; margin-left: -8px;">LM</span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: #3DBE73; color: #111111; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #111111; margin-left: -8px;">TD</span>
</div>
<span style="font-size: 13px; color: #CFCFCF;">3 sur place</span>
</div>
<a href="#" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 10px; background: #FFFFFF; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600;">Itinéraire · 8 min</a>
</div>
</section>

<button style="height: 88px; border-radius: 20px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
<span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Pointer l'arrivée</span>
<span style="font-size: 12px; color: #E3E8FF;">Position vérifiée · présence enregistrée</span>
</button>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<button style="height: 84px; border-radius: 16px; border: 1px solid #E4E2DC; background: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #111111;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg><span style="font-size: 13px; font-weight: 600;">Photo</span></button>
<button style="height: 84px; border-radius: 16px; border: 1px solid #E4E2DC; background: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #111111;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.01"></path></svg><span style="font-size: 13px; font-weight: 600;">Signaler</span></button>
<button style="height: 84px; border-radius: 16px; border: 1px solid #E4E2DC; background: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #111111;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c3-1 4-5 6-5s1 4 3 4 3-3 7-3"></path><path d="M4 21h16"></path></svg><span style="font-size: 13px; font-weight: 600;">Faire signer</span></button>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E2DC; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px;"><h2 style="margin: 0; font-size: 16px; font-weight: 600;">Tâches du jour</h2><span style="font-size: 13px; color: #5E5E5A;">1 sur 3</span></div>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px;"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #111111;"><span style="text-decoration: line-through; color: #5E5E5A;">Pose faïence murale</span></label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px;"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #111111;"><span>Joints de la douche</span></label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px;"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #111111;"><span>Évacuer les gravats</span></label>
</section>

</div>

<nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E2DC; padding: 8px 8px 20px;">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #111111; font-size: 12px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Aujourd'hui</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #5E5E5A; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Planning</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; color: #5E5E5A; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F4BFF","options":["#2F4BFF","#111111","#0F7B6C","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F4BFF' };
  }
}
</script>
</body>
</html>
