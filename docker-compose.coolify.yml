# Batimint — stack de production (Coolify, build pack « Docker Compose »).
# Voir docs/10-deploiement-coolify.md. En local : cp .env.example .env puis
#   docker compose -f docker-compose.coolify.yml up --build
# Les variables SERVICE_* sont générées par Coolify ; en local elles viennent du .env.
name: batimint

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${SERVICE_URL_WEB}
  API_URL: ${SERVICE_URL_API}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  DATABASE_URL: postgresql://batimint_app:${SERVICE_PASSWORD_APPDB}@postgres:5432/batimint
  SESSION_SECRET: ${SERVICE_PASSWORD_64_SESSION}
  PORTAL_TOKEN_SECRET: ${SERVICE_PASSWORD_64_PORTAL}
  FIELD_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_FIELDKEY}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: eu-west-1
  S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
  S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
  S3_BUCKET_UPLOADS: batimint-uploads
  S3_BUCKET_LEGAL: batimint-legal
  S3_FORCE_PATH_STYLE: 'true'
  MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MAIL_FROM: ${MAIL_FROM:-Batimint <no-reply@batimint.be>}
  INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
  INBOUND_EMAIL_PROVIDER: ${INBOUND_EMAIL_PROVIDER:-mock}
  INBOUND_EMAIL_WEBHOOK_SECRET: ${INBOUND_EMAIL_WEBHOOK_SECRET:-}
  PEPPOL_PROVIDER: ${PEPPOL_PROVIDER:-mock}
  PEPPOL_GETPEPPR_API_KEY: ${PEPPOL_GETPEPPR_API_KEY:-}
  PEPPOL_GETPEPPR_WEBHOOK_SECRET: ${PEPPOL_GETPEPPR_WEBHOOK_SECRET:-}
  ACCOUNTING_PROVIDER: ${ACCOUNTING_PROVIDER:-mock}
  CHIFT_CLIENT_ID: ${CHIFT_CLIENT_ID:-}
  CHIFT_CLIENT_SECRET: ${CHIFT_CLIENT_SECRET:-}
  CHIFT_ACCOUNT_ID: ${CHIFT_ACCOUNT_ID:-}
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
  MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
  ONSS_PROVIDER: ${ONSS_PROVIDER:-mock}
  VAT_VALIDATOR_PROVIDER: ${VAT_VALIDATOR_PROVIDER:-mock}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SERVICE_URL_WEB_3000: ''
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    # Ports publiés sur l'hôte, hors des ports courants (5000–6000) pour ne pas entrer en conflit
    # avec les autres applications du serveur. Sur Coolify, ils écoutent sur toutes les interfaces
    # (un proxy externe, p. ex. Cloudflare, peut y pointer directement) ; en local et en CI,
    # .env.example les limite à 127.0.0.1 (HOST_BIND_IP).
    ports:
      - '${HOST_BIND_IP:-0.0.0.0}:${WEB_HOST_PORT:-5380}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      SERVICE_URL_API_4000: ''
      API_PORT: '4000'
      TRUST_PROXY: 'true'
    ports:
      - '${HOST_BIND_IP:-0.0.0.0}:${API_HOST_PORT:-5480}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/healthcheck.js']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 35s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Migre (+ seed si SEED_DEMO=true), puis reste au repos et « sain » : les services applicatifs
    # attendent ce signal. Portable entre Coolify et docker compose local (ADR 0007).
    command:
      [
        'sh',
        '-c',
        'rm -f /tmp/migrated && node packages/db/dist/migrate.js deploy && touch /tmp/migrated && exec sleep infinity',
      ]
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/batimint
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-batimint-demo}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/migrated']
      interval: 3s
      timeout: 3s
      retries: 200
      start_period: 10s
    restart: on-failure:3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: batimint
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d batimint']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Fork communautaire maintenu de MinIO (images officielles plus publiées) — ADR 0006.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/batimint-uploads &&
        mc mb --ignore-existing --with-lock local/batimint-legal &&
        mc version enable local/batimint-legal &&
        (mc retention set --default GOVERNANCE 3650d local/batimint-legal || true) &&
        touch /tmp/ready && exec sleep infinity
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 3s
      timeout: 3s
      retries: 60
    restart: on-failure:3

volumes:
  postgres-data:
  minio-data:
